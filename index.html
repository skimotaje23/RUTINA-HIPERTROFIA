* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; background: var(--black); }
body {
  font-family: var(--font-body);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 100px;
}

#app { max-width: 480px; margin: 0 auto; position: relative; }

.topbar {
  padding: 22px 20px 14px;
  position: sticky; top:0; z-index: 20;
  background: linear-gradient(180deg, var(--black) 70%, rgba(10,10,11,0.85) 100%);
  backdrop-filter: blur(6px);
}
.topbar h1 {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 0.5px;
  margin: 0 0 2px;
  color: var(--yellow);
  font-weight: 400;
}
.topbar p {
  margin: 0;
  font-size: 12.5px;
  color: var(--gray);
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 14px 20px 6px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .15s ease;
  min-width: 78px;
  text-align: center;
}
.tab .tab-day {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--gray);
  font-weight: 400;
}
.tab .tab-sub {
  font-size: 10px;
  color: var(--gray-dim);
  margin-top: 2px;
  line-height: 1.2;
}
.tab.active {
  background: var(--yellow);
  border-color: var(--yellow);
}
.tab.active .tab-day { color: #1a1400; }
.tab.active .tab-sub { color: #3a2f00; }
.tab .opt-badge {
  display: inline-block;
  font-size: 8.5px;
  color: var(--yellow);
  border: 1px solid var(--yellow-dim);
  border-radius: 6px;
  padding: 1px 4px;
  margin-top: 3px;
}
.tab.active .opt-badge { color:#1a1400; border-color:#1a1400; }

.day-header {
  padding: 10px 20px 4px;
  display:flex; align-items:baseline; justify-content:space-between;
}
.day-header h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 18px;
  margin: 0;
  color: var(--white);
}
.day-header .day-note {
  font-size: 11px;
  color: var(--gray-dim);
  font-style: italic;
  font-family: var(--font-display);
}

.exercise-list { padding: 8px 16px 20px; display:flex; flex-direction:column; gap:12px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  position: relative;
}
.card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.ex-name { font-size: 15px; font-weight:600; line-height:1.3; }
.ex-meta { font-size: 11.5px; color: var(--gray); margin-top: 4px; }
.ex-meta b { color: var(--yellow); font-weight:600; }
.ex-note { font-size: 11px; color: var(--gray-dim); font-style: italic; margin-top: 4px; }

.icon-btn {
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--card-2); border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color: var(--gray); cursor:pointer; flex: 0 0 auto;
}
.icon-btn:active { background: var(--border); }
.card-actions { display:flex; gap:6px; }

.last-session {
  margin-top: 10px;
  font-size: 12px;
  color: var(--white);
  background: var(--card-2);
  border-radius: 10px;
  padding: 8px 10px;
}
.last-session .label { color: var(--gray-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }

.history-link {
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--yellow);
  opacity: 0.85;
  cursor: pointer;
}
.history-link:active { opacity: 0.6; }

.hist-row {
  display:flex; justify-content:space-between; align-items:center;
  background: var(--card); border:1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px;
}
.hist-date {
  font-family: var(--font-display); font-size: 12px; color: var(--yellow); margin-bottom: 3px;
}
.hist-sets { font-size: 12.5px; color: var(--white); }

.suggestion {
  margin-top: 8px;
  font-size: 12.5px;
  color: #1a1400;
  background: var(--yellow-soft);
  border: 1px solid var(--yellow-dim);
  border-radius: 10px;
  padding: 8px 10px;
  color: var(--yellow);
}
.suggestion .label { color: var(--yellow); opacity:0.7; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; display:block; }

.log-btn {
  margin-top: 12px;
  width: 100%;
  padding: 11px;
  border-radius: 12px;
  border: none;
  background: var(--yellow);
  color: #1a1400;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.3px;
  cursor: pointer;
}
.log-btn:active { opacity:0.85; }

.fab {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 480px;
  width: calc(100% - 40px);
  z-index: 25;
}
.fab-inner {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 16px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  color: var(--yellow);
  font-family: var(--font-display);
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
}
.fab-inner:active { background: var(--card-2); }

.overlay {
  position: fixed; inset:0; background: rgba(0,0,0,0.6);
  z-index: 40; display:flex; align-items:flex-end;
}
.sheet {
  background: var(--black-soft);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity:0 } to { transform: translateY(0); opacity:1 } }

.sheet h3 {
  font-family: var(--font-display);
  font-weight: 400;
  color: var(--yellow);
  font-size: 17px;
  margin: 4px 0 2px;
}
.sheet .sheet-sub { color: var(--gray); font-size: 12px; margin-bottom: 14px; }

.field { margin-bottom: 12px; }
.field label {
  display:block; font-size: 11.5px; color: var(--gray); margin-bottom: 5px;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.field input, .field select {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 12px;
  color: var(--white);
  font-size: 15px;
  font-family: var(--font-body);
}
.field input:focus, .field select:focus { outline: 1px solid var(--yellow); }

.row2 { display:flex; gap:10px; }
.row2 .field { flex:1; }
.row3 { display:flex; gap:8px; }
.row3 .field { flex:1; }

.set-row {
  display:flex; gap:8px; align-items:center; margin-bottom: 8px;
}
.set-row .set-num {
  width: 24px; text-align:center; color: var(--gray-dim); font-size:12px; font-family: var(--font-display);
}
.set-row input {
  flex:1; background: var(--card); border:1px solid var(--border); border-radius:9px;
  padding: 9px 8px; color: var(--white); font-size:14px; text-align:center; font-family: var(--font-body);
}
.set-row .rm { color: var(--danger); font-size: 18px; cursor:pointer; padding: 0 4px; }

.add-set-btn {
  width:100%; padding:9px; border-radius:10px; border:1px dashed var(--border);
  background: transparent; color: var(--gray); font-size: 13px; margin: 4px 0 16px; cursor:pointer;
}

.sheet-actions { display:flex; gap:10px; margin-top: 6px; }
.btn-primary, .btn-secondary {
  flex:1; padding: 13px; border-radius: 12px; border:none; font-size: 14.5px;
  font-family: var(--font-display); cursor:pointer;
}
.btn-primary { background: var(--yellow); color:#1a1400; }
.btn-secondary { background: var(--card-2); color: var(--gray); border:1px solid var(--border); }
.btn-danger { background: rgba(224,85,74,0.12); color: var(--danger); border:1px solid rgba(224,85,74,0.4); }

.toast {
  position: fixed; bottom: 100px; left:50%; transform: translateX(-50%);
  background: var(--yellow); color:#1a1400; padding: 10px 18px; border-radius: 30px;
  font-size: 13px; font-family: var(--font-display); z-index: 60;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  animation: fadeInOut 2.2s ease forwards;
}
@keyframes fadeInOut {
  0% { opacity:0; transform: translate(-50%,10px); }
  15% { opacity:1; transform: translate(-50%,0); }
  85% { opacity:1; }
  100% { opacity:0; }
}

.empty-state { padding: 40px 24px; text-align:center; color: var(--gray-dim); font-size: 13px; }

.loading-screen {
  position: fixed; inset:0; background: var(--black);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  z-index: 100;
}
.loading-screen .spinner {
  width: 26px; height:26px; border-radius:50%;
  border: 3px solid var(--border); border-top-color: var(--yellow);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-screen span { font-family: var(--font-display); color: var(--gray); font-size: 12px; }

.header-close { display:flex; justify-content:flex-end; }
.close-x {
  width: 30px; height:30px; border-radius:50%; background: var(--card);
  display:flex; align-items:center; justify-content:center; color: var(--gray); cursor:pointer;
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>HIPERTROFIA PPL</h1>
    <p>Registra tus series y deja que la app calcule tu progresión</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="day-header" id="dayHeader"></div>
  <div class="exercise-list" id="exerciseList"></div>
</div>

<div class="fab">
  <div class="fab-inner" id="addExerciseBtn">+ &nbsp; Añadir ejercicio a este día</div>
</div>

<div id="modalRoot"></div>
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <span>Cargando tu rutina…</span>
</div>

<script>
const DEFAULT_ROUTINE = [{"id": "d1", "name": "Día 1", "subtitle": "Empuje", "optional": false, "exercises": [{"id": "d1e1", "name": "Press banca (barra o mancuerna)", "sets": 4, "repMin": 6, "repMax": 8, "rir": 2, "rest": 150, "inc": 2.5, "note": "Ejercicio principal del día"}, {"id": "d1e2", "name": "Press inclinado con mancuerna", "sets": 3, "repMin": 8, "repMax": 10, "rir": 2, "rest": 90, "inc": 2, "note": "Pecho superior"}, {"id": "d1e3", "name": "Press militar mancuerna sentado", "sets": 3, "repMin": 8, "repMax": 10, "rir": 2, "rest": 90, "inc": 2, "note": ""}, {"id": "d1e4", "name": "Elevaciones laterales", "sets": 3, "repMin": 12, "repMax": 15, "rir": 1, "rest": 60, "inc": 1, "note": "Prioridad — deltoide lateral"}, {"id": "d1e5", "name": "Fondos en paralelas", "sets": 3, "repMin": 8, "repMax": 12, "rir": 2, "rest": 90, "inc": 2.5, "note": "Anota si vas lastrado o asistido"}, {"id": "d1e6", "name": "Extensión de tríceps en polea", "sets": 3, "repMin": 10, "repMax": 12, "rir": 1, "rest": 60, "inc": 2.5, "note": ""}]}, {"id": "d2", "name": "Día 2", "subtitle": "Tirón", "optional": false, "exercises": [{"id": "d2e1", "name": "Dominadas pronadoras (lastradas)", "sets": 4, "repMin": 6, "repMax": 8, "rir": 2, "rest": 120, "inc": 2.5, "note": "Mejor progresión histórica"}, {"id": "d2e2", "name": "Remo en máquina o remo T", "sets": 4, "repMin": 8, "repMax": 10, "rir": 2, "rest": 90, "inc": 5, "note": "Pecho apoyado"}, {"id": "d2e3", "name": "Jalón al pecho", "sets": 3, "repMin": 10, "repMax": 12, "rir": 2, "rest": 90, "inc": 4, "note": "Alterna abierto/cerrado"}, {"id": "d2e4", "name": "Remo en polea baja (sentado)", "sets": 3, "repMin": 10, "repMax": 12, "rir": 2, "rest": 90, "inc": 4, "note": ""}, {"id": "d2e5", "name": "Curl bíceps sentado inclinado", "sets": 3, "repMin": 10, "repMax": 12, "rir": 1, "rest": 60, "inc": 1, "note": ""}, {"id": "d2e6", "name": "Curl martillo o barra Z", "sets": 3, "repMin": 10, "repMax": 12, "rir": 1, "rest": 60, "inc": 2, "note": ""}]}, {"id": "d3", "name": "Día 3", "subtitle": "Pierna · Cuádriceps", "optional": false, "exercises": [{"id": "d3e1", "name": "Sentadilla libre con barra", "sets": 4, "repMin": 4, "repMax": 6, "rir": 2, "rest": 180, "inc": 2.5, "note": "Principal — rango bajo de reps"}, {"id": "d3e2", "name": "Prensa (pies bajos/estrechos)", "sets": 3, "repMin": 8, "repMax": 10, "rir": 2, "rest": 120, "inc": 10, "note": ""}, {"id": "d3e3", "name": "Zancada búlgara o en multipower", "sets": 3, "repMin": 8, "repMax": 10, "rir": 2, "rest": 90, "inc": 2, "note": "Alternar según disponibilidad — por pierna"}, {"id": "d3e4", "name": "Extensión de rodilla", "sets": 3, "repMin": 10, "repMax": 12, "rir": 1, "rest": 60, "inc": 5, "note": ""}]}, {"id": "d4", "name": "Día 4", "subtitle": "Empuje/Tirón · Refuerzo", "optional": false, "exercises": [{"id": "d4e1", "name": "Press militar con barra", "sets": 3, "repMin": 6, "repMax": 8, "rir": 2, "rest": 120, "inc": 2.5, "note": "Reset de carga tras estancamiento"}, {"id": "d4e2", "name": "Dominadas supinadas", "sets": 3, "repMin": 6, "repMax": 10, "rir": 2, "rest": 90, "inc": 2.5, "note": ""}, {"id": "d4e3", "name": "Remo mancuerna a un brazo", "sets": 3, "repMin": 8, "repMax": 10, "rir": 2, "rest": 90, "inc": 2, "note": "Con apoyo en banco"}, {"id": "d4e4", "name": "Elevaciones laterales", "sets": 3, "repMin": 12, "repMax": 15, "rir": 1, "rest": 60, "inc": 1, "note": "Segunda dosis semanal"}, {"id": "d4e5", "name": "Curl bíceps + ext. tríceps (superserie)", "sets": 3, "repMin": 12, "repMax": 12, "rir": 1, "rest": 60, "inc": 1, "note": "Segunda dosis de brazos"}]}, {"id": "d5", "name": "Día 5", "subtitle": "Pierna · Cadena posterior", "optional": true, "exercises": [{"id": "d5e1", "name": "Sentadilla libre o máquina (rango completo)", "sets": 4, "repMin": 8, "repMax": 10, "rir": 2, "rest": 150, "inc": 2.5, "note": "Segundo estímulo de cuádriceps"}, {"id": "d5e2", "name": "Extensión de rodilla (variante distinta)", "sets": 3, "repMin": 12, "repMax": 15, "rir": 1, "rest": 60, "inc": 5, "note": ""}, {"id": "d5e3", "name": "Curl femoral", "sets": 3, "repMin": 10, "repMax": 12, "rir": 2, "rest": 90, "inc": 5, "note": "Déficit histórico"}, {"id": "d5e4", "name": "Aductor (máquina)", "sets": 3, "repMin": 10, "repMax": 12, "rir": 1, "rest": 60, "inc": 5, "note": ""}, {"id": "d5e5", "name": "Abducción de cadera / glúteo medio", "sets": 3, "repMin": 12, "repMax": 15, "rir": 1, "rest": 45, "inc": 5, "note": ""}]}];

let routine = null;
let logs = {}; // { exerciseId: [ {date, sets:[{weight,reps,rir}]} ] }
let activeDayId = 'd1';

const STORAGE_ROUTINE_KEY = 'ppl-routine-v1';
const STORAGE_LOGS_KEY = 'ppl-logs-v1';

function uid(prefix) {
  return prefix + '_' + Math.random().toString(36).slice(2, 9);
}

async function loadData() {
  try {
    const r = await storageGet(STORAGE_ROUTINE_KEY);
    routine = r ? JSON.parse(r) : JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  } catch (e) {
    routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  }
  try {
    const l = await storageGet(STORAGE_LOGS_KEY);
    logs = l ? JSON.parse(l) : {};
  } catch (e) {
    logs = {};
  }
  if (!routine || !routine.length) routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
}

async function saveRoutine() {
  await storageSet(STORAGE_ROUTINE_KEY, JSON.stringify(routine));
}

async function saveLogs() {
  return await storageSet(STORAGE_LOGS_KEY, JSON.stringify(logs));
}

async function storageGet(key) {
  if (window.storage && typeof window.storage.get === 'function') {
    try {
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    } catch (e) {
      return storageGetLocal(key);
    }
  }
  return storageGetLocal(key);
}

async function storageSet(key, value) {
  let ok = false;
  if (window.storage && typeof window.storage.set === 'function') {
    try {
      const r = await window.storage.set(key, value, false);
      ok = !!r;
    } catch (e) {
      ok = false;
    }
  }
  const localOk = storageSetLocal(key, value);
  return ok || localOk;
}

function storageGetLocal(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}

function storageSetLocal(key, value) {
  try {
    window.localStorage.setItem(key, value);
    return true;
  } catch (e) {
    console.error('No se pudo guardar en localStorage', e);
    return false;
  }
}

function getDay(id) { return routine.find(d => d.id === id); }

function lastSessionFor(exerciseId) {
  const arr = logs[exerciseId];
  if (!arr || !arr.length) return null;
  return arr[arr.length - 1];
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}

function suggestNext(ex, session) {
  if (!session) return { text: 'Registra tu primera sesión para recibir una sugerencia.', neutral: true };
  const reps = session.sets.map(s => s.reps);
  const rirs = session.sets.map(s => s.rir);
  const minReps = Math.min(...reps);
  const avgRir = rirs.reduce((a,b) => a+b, 0) / rirs.length;
  const lastWeight = session.sets[session.sets.length - 1].weight;
  const nextWeight = Math.round((lastWeight + ex.inc) * 100) / 100;

  if (minReps >= ex.repMax) {
    if (avgRir < ex.rir - 0.5) {
      return { text: `Llegaste a ${ex.repMax} reps pero más cerca del fallo de lo previsto (RIR objetivo ${ex.rir}). Repite ${lastWeight}kg una sesión más antes de subir.` };
    }
    return { text: `Sube a ${nextWeight}kg. Busca ${ex.repMin}-${ex.repMax} reps a RIR${ex.rir}.` };
  }
  if (minReps >= ex.repMin) {
    return { text: `Mantén ${lastWeight}kg. Busca subir reps hacia ${ex.repMax} (llegaste a ${minReps}) a RIR${ex.rir}.` };
  }
  return { text: `Te quedaste por debajo del rango (${minReps} reps). Mantén ${lastWeight}kg y prioriza técnica/descanso antes de la próxima sesión.` };
}

function render() {
  renderTabs();
  renderDayHeader();
  renderExercises();
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  routine.forEach(day => {
    const el = document.createElement('div');
    el.className = 'tab' + (day.id === activeDayId ? ' active' : '');
    el.innerHTML = `
      <div class="tab-day">${day.name}</div>
      <div class="tab-sub">${day.subtitle}</div>
      ${day.optional ? '<div class="opt-badge">opcional</div>' : ''}
    `;
    el.onclick = () => { activeDayId = day.id; render(); };
    tabsEl.appendChild(el);
  });
}

function renderDayHeader() {
  const day = getDay(activeDayId);
  const el = document.getElementById('dayHeader');
  el.innerHTML = `<h2>${day.subtitle}</h2>` + (day.optional ? `<span class="day-note">según disponibilidad</span>` : '');
}

function renderExercises() {
  const day = getDay(activeDayId);
  const list = document.getElementById('exerciseList');
  list.innerHTML = '';

  if (!day.exercises.length) {
    list.innerHTML = '<div class="empty-state">No hay ejercicios en este día todavía.<br>Añade el primero con el botón de abajo.</div>';
    return;
  }

  day.exercises.forEach(ex => {
    const session = lastSessionFor(ex.id);
    const sug = suggestNext(ex, session);
    const card = document.createElement('div');
    card.className = 'card';

    let lastHtml = '';
    if (session) {
      const setsStr = session.sets.map(s => `${s.reps}x${s.weight}kg (RIR${s.rir})`).join(' · ');
      lastHtml = `<div class="last-session"><div class="label">Última vez · ${fmtDate(session.date)}</div>${setsStr}</div>
      <div class="history-link" data-action="history">Ver historial completo (${(logs[ex.id] || []).length} sesiones) ›</div>`;
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${ex.sets}x<b>${ex.repMin}-${ex.repMax}</b> reps &nbsp;·&nbsp; RIR <b>${ex.rir}</b> &nbsp;·&nbsp; Descanso ${ex.rest >= 60 ? Math.round(ex.rest/60*10)/10 + ' min' : ex.rest + ' s'}</div>
          ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
        </div>
        <div class="card-actions">
          <div class="icon-btn" data-action="edit" title="Editar">✎</div>
          <div class="icon-btn" data-action="delete" title="Eliminar">✕</div>
        </div>
      </div>
      ${lastHtml}
      <div class="suggestion"><span class="label">Sugerencia próxima sesión</span>${sug.text}</div>
      <button class="log-btn" data-action="log">Registrar sesión de hoy</button>
    `;

    card.querySelector('[data-action="log"]').onclick = () => openLogSheet(ex);
    card.querySelector('[data-action="edit"]').onclick = () => openEditExerciseSheet(day, ex);
    card.querySelector('[data-action="delete"]').onclick = () => confirmDeleteExercise(day, ex);
    const histLink = card.querySelector('[data-action="history"]');
    if (histLink) histLink.onclick = () => openHistorySheet(ex);

    list.appendChild(card);
  });
}

// ---------- Modals ----------

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function openOverlay(innerHtml) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="overlayBg"><div class="sheet">${innerHtml}</div></div>`;
  document.getElementById('overlayBg').addEventListener('click', (e) => {
    if (e.target.id === 'overlayBg') closeModal();
  });
}

function openHistorySheet(ex) {
  renderHistorySheet(ex);
}

function renderHistorySheet(ex) {
  const sessions = (logs[ex.id] || []).slice().reverse();
  const rowsHtml = sessions.map((session, revIdx) => {
    const realIdx = logs[ex.id].length - 1 - revIdx;
    const setsStr = session.sets.map(s => `${s.reps}x${s.weight}kg (RIR${s.rir})`).join(' · ');
    return `
      <div class="hist-row">
        <div>
          <div class="hist-date">${fmtDate(session.date)}</div>
          <div class="hist-sets">${setsStr}</div>
        </div>
        <div class="rm" data-del="${realIdx}">–</div>
      </div>
    `;
  }).join('');

  openOverlay(`
    <div class="header-close"><div class="close-x" id="closeBtn">✕</div></div>
    <h3>${ex.name}</h3>
    <div class="sheet-sub">${sessions.length} sesión${sessions.length === 1 ? '' : 'es'} registrada${sessions.length === 1 ? '' : 's'}</div>
    <div id="histContainer">${rowsHtml || '<div class="empty-state">Sin sesiones todavía.</div>'}</div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="closeHist">Cerrar</button>
    </div>
  `);
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('closeHist').onclick = closeModal;
  document.querySelectorAll('#histContainer .rm').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.getAttribute('data-del'), 10);
      logs[ex.id].splice(idx, 1);
      await saveLogs();
      render();
      renderHistorySheet(ex);
      showToast('Sesión eliminada');
    };
  });
}
  const setCount = ex.sets;
  let setsHtml = '';
  for (let i = 0; i < setCount; i++) {
    setsHtml += setRowHtml(i + 1);
  }
  openOverlay(`
    <div class="header-close"><div class="close-x" id="closeBtn">✕</div></div>
    <h3>${ex.name}</h3>
    <div class="sheet-sub">${ex.sets}x${ex.repMin}-${ex.repMax} reps · RIR objetivo ${ex.rir}</div>
    <div id="setsContainer">${setsHtml}</div>
    <button class="add-set-btn" id="addSetBtn">+ Añadir serie</button>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelLog">Cancelar</button>
      <button class="btn-primary" id="saveLog">Guardar sesión</button>
    </div>
  `);
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('cancelLog').onclick = closeModal;
  document.getElementById('addSetBtn').onclick = () => {
    const container = document.getElementById('setsContainer');
    const n = container.children.length + 1;
    container.insertAdjacentHTML('beforeend', setRowHtml(n));
    attachRemoveHandlers();
  };
  attachRemoveHandlers();

  document.getElementById('saveLog').onclick = async () => {
    const rows = document.querySelectorAll('#setsContainer .set-row');
    const sets = [];
    let valid = true;
    rows.forEach(row => {
      const weight = parseFloat(row.querySelector('.w-input').value);
      const reps = parseInt(row.querySelector('.r-input').value, 10);
      const rir = parseFloat(row.querySelector('.rir-input').value);
      if (isNaN(weight) || isNaN(reps) || isNaN(rir)) { valid = false; return; }
      sets.push({ weight, reps, rir });
    });
    if (!valid || !sets.length) {
      alert('Rellena peso, reps y RIR en cada serie.');
      return;
    }
    if (!logs[ex.id]) logs[ex.id] = [];
    logs[ex.id].push({ date: new Date().toISOString(), sets });
    if (logs[ex.id].length > 30) logs[ex.id] = logs[ex.id].slice(-30);
    const saved = await saveLogs();
    closeModal();
    render();
    if (saved) {
      showToast('Sesión guardada');
    } else {
      showToast('No se pudo guardar. Revisa que no estés en modo incógnito.', true);
    }
  };
}

function setRowHtml(n) {
  return `
    <div class="set-row">
      <div class="set-num">${n}</div>
      <input class="w-input" type="number" inputmode="decimal" placeholder="kg" step="0.5">
      <input class="r-input" type="number" inputmode="numeric" placeholder="reps">
      <input class="rir-input" type="number" inputmode="numeric" placeholder="RIR">
      <div class="rm" data-rm="1">–</div>
    </div>
  `;
}

function attachRemoveHandlers() {
  document.querySelectorAll('#setsContainer .rm').forEach(btn => {
    btn.onclick = (e) => {
      const container = document.getElementById('setsContainer');
      if (container.children.length <= 1) return;
      e.target.closest('.set-row').remove();
      Array.from(container.children).forEach((row, idx) => {
        row.querySelector('.set-num').textContent = idx + 1;
      });
    };
  });
}

function openAddExerciseSheet(day) {
  openOverlay(`
    <div class="header-close"><div class="close-x" id="closeBtn">✕</div></div>
    <h3>Añadir ejercicio</h3>
    <div class="sheet-sub">${day.subtitle}</div>
    ${exerciseFormHtml()}
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelForm">Cancelar</button>
      <button class="btn-primary" id="saveForm">Añadir</button>
    </div>
  `);
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('cancelForm').onclick = closeModal;
  document.getElementById('saveForm').onclick = async () => {
    const data = readExerciseForm();
    if (!data) return;
    day.exercises.push({ id: uid('ex'), ...data });
    await saveRoutine();
    closeModal();
    render();
    showToast('Ejercicio añadido');
  };
}

function openEditExerciseSheet(day, ex) {
  openOverlay(`
    <div class="header-close"><div class="close-x" id="closeBtn">✕</div></div>
    <h3>Editar ejercicio</h3>
    ${exerciseFormHtml(ex)}
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelForm">Cancelar</button>
      <button class="btn-primary" id="saveForm">Guardar cambios</button>
    </div>
  `);
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('cancelForm').onclick = closeModal;
  document.getElementById('saveForm').onclick = async () => {
    const data = readExerciseForm();
    if (!data) return;
    Object.assign(ex, data);
    await saveRoutine();
    closeModal();
    render();
    showToast('Cambios guardados');
  };
}

function exerciseFormHtml(ex) {
  ex = ex || { name: '', sets: 3, repMin: 8, repMax: 10, rir: 2, rest: 90, inc: 2.5, note: '' };
  return `
    <div class="field">
      <label>Nombre del ejercicio</label>
      <input id="f-name" type="text" value="${ex.name}" placeholder="Ej. Curl bíceps banco Scott">
    </div>
    <div class="row3">
      <div class="field"><label>Series</label><input id="f-sets" type="number" value="${ex.sets}"></div>
      <div class="field"><label>Reps min</label><input id="f-repmin" type="number" value="${ex.repMin}"></div>
      <div class="field"><label>Reps max</label><input id="f-repmax" type="number" value="${ex.repMax}"></div>
    </div>
    <div class="row3">
      <div class="field"><label>RIR</label><input id="f-rir" type="number" step="0.5" value="${ex.rir}"></div>
      <div class="field"><label>Descanso (s)</label><input id="f-rest" type="number" value="${ex.rest}"></div>
      <div class="field"><label>Incremento (kg)</label><input id="f-inc" type="number" step="0.5" value="${ex.inc}"></div>
    </div>
    <div class="field">
      <label>Nota (opcional)</label>
      <input id="f-note" type="text" value="${ex.note || ''}" placeholder="Ej. Alternar según disponibilidad">
    </div>
  `;
}

function readExerciseForm() {
  const name = document.getElementById('f-name').value.trim();
  const sets = parseInt(document.getElementById('f-sets').value, 10);
  const repMin = parseInt(document.getElementById('f-repmin').value, 10);
  const repMax = parseInt(document.getElementById('f-repmax').value, 10);
  const rir = parseFloat(document.getElementById('f-rir').value);
  const rest = parseInt(document.getElementById('f-rest').value, 10);
  const inc = parseFloat(document.getElementById('f-inc').value);
  const note = document.getElementById('f-note').value.trim();
  if (!name || isNaN(sets) || isNaN(repMin) || isNaN(repMax) || isNaN(rir) || isNaN(rest) || isNaN(inc)) {
    alert('Revisa que todos los campos numéricos estén rellenos correctamente.');
    return null;
  }
  return { name, sets, repMin, repMax, rir, rest, inc, note };
}

function confirmDeleteExercise(day, ex) {
  openOverlay(`
    <div class="header-close"><div class="close-x" id="closeBtn">✕</div></div>
    <h3>Eliminar ejercicio</h3>
    <div class="sheet-sub">¿Seguro que quieres quitar "${ex.name}" de ${day.subtitle}? Se mantendrá su historial guardado, pero dejará de aparecer en la rutina.</div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelDel">Cancelar</button>
      <button class="btn-danger" id="confirmDel">Eliminar</button>
    </div>
  `);
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('cancelDel').onclick = closeModal;
  document.getElementById('confirmDel').onclick = async () => {
    day.exercises = day.exercises.filter(e => e.id !== ex.id);
    await saveRoutine();
    closeModal();
    render();
    showToast('Ejercicio eliminado');
  };
}

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast';
  if (isError) { t.style.background = '#e0554a'; t.style.color = '#fff'; }
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

document.getElementById('addExerciseBtn').onclick = () => {
  openAddExerciseSheet(getDay(activeDayId));
};

(async function init() {
  await loadData();
  document.getElementById('loadingScreen').remove();
  render();
})();
</script>
